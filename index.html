<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validação de certificados – VII SIMPPGES</title>
<style>
  :root { --verde:#1C8574; --azul:#1D4F91; --texto:#222; --cinza:#5f6368; --borda:#d9e2e0; --fundo:#f4f7f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; color:var(--texto); background:var(--fundo); }
  .faixa { height:6px; background:var(--verde); }
  header { background:#fff; border-bottom:1px solid var(--borda); }
  .logos { max-width:860px; margin:0 auto; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .logos img { display:block; }
  main { max-width:640px; margin:36px auto 48px; padding:0 20px; }
  h1 { color:var(--verde); font-size:1.6rem; letter-spacing:.04em; margin:0 0 6px; text-align:center; }
  .sub { color:var(--azul); text-align:center; margin:0 0 28px; font-size:.95rem; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:10px; padding:24px; }
  label { display:block; font-weight:bold; margin-bottom:8px; }
  .linha { display:flex; gap:10px; }
  input { flex:1; min-width:0; font:inherit; font-size:1.1rem; letter-spacing:.06em; text-transform:uppercase; padding:12px 14px; border:1px solid #b8c4c2; border-radius:8px; }
  input:focus { outline:2px solid var(--verde); outline-offset:1px; border-color:var(--verde); }
  button { font:inherit; font-weight:bold; color:#fff; background:var(--verde); border:0; border-radius:8px; padding:0 20px; cursor:pointer; }
  button:hover { background:#156d5f; }
  .dica { color:var(--cinza); font-size:.85rem; margin:8px 0 0; }
  .res { margin-top:20px; border-radius:10px; padding:20px 22px; display:none; }
  .ok { display:block; background:#eef8f5; border:1px solid #9fd3c6; }
  .erro { display:block; background:#fdf1f0; border:1px solid #efb7b1; }
  .res h2 { margin:0 0 12px; font-size:1.1rem; }
  .ok h2 { color:var(--verde); } .erro h2 { color:#b3261e; }
  dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:8px 16px; }
  dt { color:var(--cinza); } dd { margin:0; font-weight:bold; }
  dd.nome { color:var(--azul); }
  footer { text-align:center; color:var(--cinza); font-size:.8rem; padding:0 20px 30px; }
  @media (max-width:520px){ .linha{flex-direction:column;} button{padding:12px;} dl{grid-template-columns:1fr; gap:2px;} dd{margin-bottom:8px;} }
</style>
</head>

const enc = new TextEncoder();
const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
function normaliza(s) {
  s = (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length === 12 && s.startsWith('S26')) return 'S26-' + s[3] + '-' + s.slice(4, 8) + '-' + s.slice(8);
  return s;
}
const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
async function valida(bruto) {
  const r = document.getElementById('r');
  const c = normaliza(bruto);
  try {
    const id = hex(await crypto.subtle.digest('SHA-256', enc.encode('SIMPPGES26|' + c)));
    if (!D[id]) throw 0;
    const k = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', enc.encode('K|' + c)), 'AES-GCM', false, ['decrypt']);
    const raw = Uint8Array.from(atob(D[id]), ch => ch.charCodeAt(0));
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, k, raw.slice(12));
    const x = JSON.parse(new TextDecoder().decode(pt));
    let h = '<h2>✓ Certificado válido</h2><dl>' +
      '<dt>Código</dt><dd>' + esc(c) + '</dd>' +
      '<dt>Nome</dt><dd class="nome">' + esc(x.n) + '</dd>' +
      '<dt>Certificado</dt><dd>' + esc(x.t) + '</dd>';
    if (x.w) h += '<dt>Trabalho</dt><dd>“' + esc(x.w) + '”</dd>';
    if (x.h) h += '<dt>Carga horária</dt><dd>' + esc(x.h) + '</dd>';
    h += '<dt>Evento</dt><dd>VII SIMPPGES – 21 e 22 de outubro de 2026, UFSC – Campus Araranguá</dd>' +
         '<dt>Emitido em</dt><dd>' + esc(x.e) + '</dd></dl>';
    r.className = 'res ok'; r.innerHTML = h;
  } catch (e) {
    r.className = 'res erro';
    r.innerHTML = '<h2>Código não encontrado</h2><p style="margin:0">Confira se o código foi digitado exatamente como aparece no certificado. ' +
      'Persistindo a dúvida, entre em contato com a Comissão Organizadora do VII SIMPPGES.</p>';
  }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); valida(document.getElementById('c').value); });
const q = new URLSearchParams(location.search).get('c');
if (q) { document.getElementById('c').value = normaliza(q); valida(q); }
